name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: WorkHelper/requirements.txt

      - name: Install dependencies
        working-directory: WorkHelper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build updater.exe
        working-directory: WorkHelper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/_updater_dist | Out-Null
          python -m PyInstaller --clean --noconfirm --onefile --name updater `
            --distpath build/_updater_dist `
            --workpath build/_updater_build `
            updater.py

      - name: Build app package
        working-directory: WorkHelper
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm build/WorkHelper.spec
          Copy-Item -Force "build/_updater_dist/updater.exe" "dist/updater.exe"
          Compress-Archive -Force `
            -Path "dist/6PM Assistant.exe", "dist/updater.exe" `
            -DestinationPath "dist/6PM Assistant.zip"

      - name: Verify build
        working-directory: WorkHelper
        shell: pwsh
        run: |
          $zip = "dist/6PM Assistant.zip"
          if (-not (Test-Path "dist/6PM Assistant.exe")) { throw "6PM Assistant.exe missing" }
          if (-not (Test-Path "dist/updater.exe")) { throw "updater.exe missing" }
          if (-not (Test-Path $zip)) { throw "zip package missing" }
          $size = (Get-Item "dist/6PM Assistant.exe").Length / 1MB
          $updaterSize = (Get-Item "dist/updater.exe").Length / 1MB
          $zipSize = (Get-Item $zip).Length / 1MB
          Write-Host ("6PM Assistant.exe: {0:N1} MB" -f $size)
          Write-Host ("updater.exe: {0:N1} MB" -f $updaterSize)
          Write-Host ("package zip: {0:N1} MB" -f $zipSize)

      - name: Read version
        id: ver
        working-directory: WorkHelper
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## v${{ steps.ver.outputs.version }}

            ### 설치 / 업데이트 방법
            1. `6PM Assistant.zip`을 다운로드하세요.
            2. 압축을 푼 뒤 `6PM Assistant.exe`와 `updater.exe`를 같은 폴더에 두세요.
            3. 이후 앱 내 **설정 -> 업데이트 확인** 버튼을 사용할 수 있습니다.
          files: WorkHelper/dist/6PM Assistant.zip
          draft: false
          prerelease: false
