name: Build & Release

# v* 태그가 푸시될 때 자동 실행 (예: v1.2.0)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: WorkHelper/requirements.txt

      - name: Install dependencies
        working-directory: WorkHelper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # updater.exe 먼저 빌드 → 메인 exe 번들에 포함
      - name: Build updater.exe
        working-directory: WorkHelper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/_updater_dist | Out-Null
          python -m PyInstaller --clean --noconfirm --onefile --name updater `
            --distpath build/_updater_dist `
            --workpath build/_updater_build `
            updater.py

      # 메인 앱 빌드 (updater.exe 번들 포함)
      - name: Build main exe
        working-directory: WorkHelper
        run: python -m PyInstaller --clean --noconfirm build/WorkHelper.spec

      - name: Verify build
        working-directory: WorkHelper
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/6PM Assistant.exe")) { throw "메인 exe 없음" }
          $size = (Get-Item "dist/6PM Assistant.exe").Length / 1MB
          Write-Host ("6PM Assistant.exe: {0:N1} MB" -f $size)

      - name: Read version
        id: ver
        working-directory: WorkHelper
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # exe 1개만 업로드
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }}"
          body: |
            ## v${{ steps.ver.outputs.version }}

            ### 설치 / 업데이트 방법
            1. `6PM Assistant.exe` 를 다운로드하세요.
            2. 기존 파일이 있다면 덮어쓰거나, 앱 내 **설정 → 업데이트 확인** 버튼을 사용하세요.
          files: WorkHelper/dist/6PM Assistant.exe
          draft: false
          prerelease: false
